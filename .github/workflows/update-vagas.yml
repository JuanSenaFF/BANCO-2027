name: Atualizar vagas

on:
  workflow_dispatch:
  schedule:
    - cron: '0 10 * * 1-5'
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-vagas.yml'
      - 'scripts/update_vagas.py'

permissions:
  contents: write

concurrency:
  group: atualizar-vagas
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: pip install requests beautifulsoup4

      - name: Buscar e consolidar vagas
        run: python scripts/update_vagas.py

      - name: Publicar alterações
        run: |
          if git diff --quiet -- data-auto.js; then
            echo "Nenhuma vaga nova distinta por exigências."
            exit 0
          fi
          git config user.name "banco-2027-bot"
          git config user.email "banco-2027-bot@users.noreply.github.com"
          git add data-auto.js
          git commit -m "Atualiza vagas automaticamente"
          git push
